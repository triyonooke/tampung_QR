<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Log Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding: 15px;
      margin: 0;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #reader {
      width: 100%;
      margin-top: 15px;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      background-color: #e3f2fd;
      color: #0d47a1;
      word-break: break-all;
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>QR Code Scanner Log</h2>
    <p>Arahkan kamera ke QR Code untuk menyimpan data ke Google Sheet.</p>
    <div id="reader"></div>
    <div id="status">Status: Siap memindai...</div>
  </div>

  <script>
    // GANTI TEKS DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwy4eMsGyKegJH_Geq9XyP9CkKq9xYrSJ9HcTtAMzSOP5L5N35Ap6PIjKGAOYU4j_Kq7A/exec";

    let lastScannedText = "";
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing || decodedText === lastScannedText) return;

      isProcessing = true;
      lastScannedText = decodedText;
      
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Menyimpan ke Sheet: " + decodedText + "...";
      statusEl.style.backgroundColor = "#fff3cd";
      statusEl.style.color = "#856404";

      // Mengirim data ke Google Apps Script menggunakan fetch API
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Diperlukan untuk CORS bypass Google Apps Script
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: decodedText })
      })
      .then(() => {
        statusEl.innerText = "Berhasil disimpan: " + decodedText;
        statusEl.style.backgroundColor = "#d4edda";
        statusEl.style.color = "#155724";

        // Jeda 3 detik sebelum siap memindai kode berikutnya
        setTimeout(() => {
          isProcessing = false;
          lastScannedText = "";
          statusEl.innerText = "Status: Siap memindai...";
          statusEl.style.backgroundColor = "#e3f2fd";
          statusEl.style.color = "#0d47a1";
        }, 3000);
      })
      .catch(err => {
        statusEl.innerText = "Gagal mengirim data: " + err;
        statusEl.style.backgroundColor = "#f8d7da";
        statusEl.style.color = "#721c24";
        isProcessing = false;
      });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
